<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #00ffcc;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    text-align: center;
    width: 500px;
    padding: 40px;
    background: rgba(15, 15, 25, 0.9);
    border: 1px solid rgba(0, 255, 204, 0.3);
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 255, 204, 0.1);
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 16px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(0, 255, 204, 0.3);
    border-radius: 8px;
    color: #00ffcc;
    font-size: 18px;
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: border 0.3s;
  }
  input:focus { border-color: #00ffcc; }
  input::placeholder { color: #444; letter-spacing: 1px; }
  button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: linear-gradient(135deg, #00ffcc, #00aa88);
    border: none;
    border-radius: 8px;
    color: #000;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0, 255, 204, 0.3);
  }
  button:active { transform: translateY(0); }
  .status {
    margin-top: 20px;
    font-size: 14px;
    min-height: 20px;
  }
  .status.error { color: #ff4444; }
  .status.success { color: #00ff88; }
  .spinner {
    display: none;
    margin: 20px auto;
    width: 40px;
    height: 40px;
    border: 3px solid rgba(0, 255, 204, 0.2);
    border-top-color: #00ffcc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>JARVIS OS</h1>
  <p class="subtitle">Введите лицензионный ключ для активации</p>
  <input type="text" id="keyInput" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off">
  <div class="spinner" id="spinner"></div>
  <button id="activateBtn">Активировать</button>
  <div class="status" id="status"></div>
</div>
<script>
  function activate() {
    const key = document.getElementById('keyInput').value.trim();
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const btn = document.getElementById('activateBtn');

    if (!key) {
      status.className = 'status error';
      status.textContent = 'Введите ключ';
      return;
    }

    btn.disabled = true;
    spinner.style.display = 'block';
    status.textContent = '';
    status.className = 'status';

    window.pywebview.api.activate(key).then(function(result) {
      spinner.style.display = 'none';
      btn.disabled = false;

      if (result.ok) {
        status.className = 'status success';
        status.textContent = result.message;
        setTimeout(function() {
          window.pywebview.api.load_main();
        }, 1500);
      } else {
        status.className = 'status error';
        status.textContent = result.error;
      }
    }).catch(function(err) {
      spinner.style.display = 'none';
      btn.disabled = false;
      status.className = 'status error';
      status.textContent = 'Ошибка соединения';
    });
  }

  document.getElementById('activateBtn').addEventListener('click', activate);
  document.getElementById('keyInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') activate();
  });
</script>
</body>
</html>
